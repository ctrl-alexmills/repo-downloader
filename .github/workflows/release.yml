name: Build and release

# Push a tag like v1.2.0 to build and publish a release.
# Run it by hand from the Actions tab to just build (files appear under the run's Artifacts).
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"

      - name: Read version
        id: version
        run: |
          $version = python -c "import ast; t = ast.parse(open('repo_downloader.py', encoding='utf-8').read()); print(next(n.value.value for n in t.body if isinstance(n, ast.Assign) and n.targets[0].id == '__version__'))"
          if ("${{ github.ref_type }}" -eq "tag" -and "${{ github.ref_name }}" -ne "v$version") {
            throw "Tag ${{ github.ref_name }} doesn't match __version__ = $version in repo_downloader.py"
          }
          "version=$version" >> $env:GITHUB_OUTPUT

      - name: Build exe
        run: |
          python -m pip install pyinstaller==6.22.3
          python -m PyInstaller --onefile --windowed --clean --noconfirm --name "Repo Downloader" repo_downloader.py

      - name: Build installer
        run: |
          choco install innosetup -y --no-progress
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" "/DMyAppVersion=${{ steps.version.outputs.version }}" installer.iss
          if ($LASTEXITCODE -ne 0) { throw "Installer build failed" }

      - name: Collect files
        run: |
          $v = "${{ steps.version.outputs.version }}"
          New-Item -ItemType Directory release | Out-Null
          Copy-Item "Output\RepoDownloader-Setup-$v.exe" release\
          Copy-Item "dist\Repo Downloader.exe" "release\RepoDownloader-$v-portable.exe"
          Get-ChildItem release -File | ForEach-Object {
            "$((Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower())  $($_.Name)"
          } | Set-Content release\SHA256SUMS.txt -Encoding ascii

      - uses: actions/upload-artifact@v6
        with:
          name: RepoDownloader-${{ steps.version.outputs.version }}
          path: release/

      - name: Publish release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ github.ref_name }}" release/* --title "Repo Downloader ${{ steps.version.outputs.version }}" --notes-file .github/release-notes.md
